databaseChangeLog:
  - changeSet:
      id: 0012-create-itinerary
      author: trip-trove
      changes:
        - sql:
            sql: |
              CREATE TABLE IF NOT EXISTS itinerary (
                  trip_id BIGINT PRIMARY KEY REFERENCES trip (id) ON DELETE CASCADE,
                  initial_zone VARCHAR(255),
                  last_checked_at TIMESTAMP WITH TIME ZONE
              );
              CREATE TABLE IF NOT EXISTS itinerary_day (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  trip_id BIGINT NOT NULL REFERENCES itinerary (trip_id) ON DELETE CASCADE,
                  day_date DATE NOT NULL,
                  UNIQUE (trip_id, day_date)
              );
        - sql:
            splitStatements: false
            sql: |
              DO $$
              DECLARE
                  invalid_trips TEXT;
              BEGIN
                  SELECT string_agg(format('%s (%s to %s)', id, trip_start_date, trip_end_date), ', ' ORDER BY id)
                  INTO invalid_trips
                  FROM trip
                  WHERE trip_start_date IS NULL OR trip_end_date IS NULL
                     OR NOT isfinite(trip_start_date) OR NOT isfinite(trip_end_date)
                     OR trip_start_date > trip_end_date;

                  IF invalid_trips IS NOT NULL THEN
                      RAISE EXCEPTION 'Invalid saved trip dates; cannot initialize itineraries: %', invalid_trips;
                  END IF;
              END $$;
        - sql:
            sql: |
              WITH new_itineraries AS (
                  INSERT INTO itinerary (trip_id)
                  SELECT id FROM trip
                  ON CONFLICT (trip_id) DO NOTHING
                  RETURNING trip_id
              )
              INSERT INTO itinerary_day (trip_id, day_date)
              SELECT t.id, t.trip_start_date + day_offset
              FROM new_itineraries i
              JOIN trip t ON t.id = i.trip_id
              CROSS JOIN LATERAL generate_series(0, t.trip_end_date - t.trip_start_date) AS days(day_offset);
