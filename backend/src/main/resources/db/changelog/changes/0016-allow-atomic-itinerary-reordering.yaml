databaseChangeLog:
  - changeSet:
      id: 0016-allow-atomic-itinerary-reordering
      author: trip-trove
      changes:
        - sql:
            sql: |
              ALTER TABLE itinerary_entry
                DROP CONSTRAINT itinerary_entry_trip_id_date_path_position_key,
                ADD CONSTRAINT itinerary_entry_path_position_key
                  UNIQUE (trip_id, date, path_position) DEFERRABLE INITIALLY DEFERRED;
              ALTER TABLE itinerary_entry ADD COLUMN moved_since_check BOOLEAN NOT NULL DEFAULT FALSE;
              ALTER TABLE itinerary_entry ADD COLUMN following_starts_pushed_since_check BOOLEAN NOT NULL DEFAULT FALSE;
              CREATE TABLE itinerary_entry_removal (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  trip_id BIGINT NOT NULL REFERENCES itinerary (trip_id) ON DELETE CASCADE,
                  date DATE NOT NULL,
                  subject VARCHAR(255) NOT NULL,
                  following_starts_pushed BOOLEAN NOT NULL DEFAULT FALSE
              );
              CREATE INDEX itinerary_entry_removal_trip_id_idx ON itinerary_entry_removal (trip_id);
